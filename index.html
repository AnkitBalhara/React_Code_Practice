<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Practices</title>
</head>

<body>
    <input type="text" id="input_value">

    <script>
        const debounce = (fn, delay) => {
            let timer;
            return function (...args) {
                clearTimeout(timer)
                timer = setTimeout(() => {
                    fn(...args)
                }, delay)
            }
        }

        const deb = (query) => {
            console.log("Jai Shree Ram", query)
        }

        const callde = debounce(deb, 500)

        document.getElementById("input_value").addEventListener("input", (e) => {
            callde(e.target.value)
        })

    </script>
</body>

</html>
